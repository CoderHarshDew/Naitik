<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ration Subsidy Tracker</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, rgba(106, 17, 203, 0.8), rgba(37, 117, 252, 0.8)),
                  url('https://images.unsplash.com/photo-1566977744270-7f6a7c1f8f0e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .container-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.25);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .hidden { display: none; }
    .btn-custom {
      width: 100%;
      margin-top: 10px;
    }
    .logo {
      width: 120px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  
  <!-- First Page (Logo + Continue) -->
  <div class="container-box" id="welcomePage">
    <!-- Ration Card / Food Bag Logo -->
    <img src="images/logo.png" alt="Ration App Logo" class="logo">
    
    <h3 class="fw-bold">Ration Subsidy Tracker</h3>
    <p class="text-muted">Welcome! Click below to continue.</p>
    <button class="btn btn-primary btn-custom" onclick="showLanguage()">Continue</button>
  </div>

  <!-- Second Page (Select Language) -->
  <div class="container-box hidden" id="languagePage">
    <h4 class="fw-bold mb-3">Select Language</h4>
    <select class="form-select mb-3">
      <option selected disabled>Choose your language</option>
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
      <option value="bn">বাংলা</option>
    </select>
    <button class="btn btn-success btn-custom" onclick="showLogin()">Continue</button>
  </div>

  <!-- Third Page (Login Page) -->
  <div class="container-box hidden" id="loginPage">
    <h4 class="fw-bold mb-3">Login</h4>

    <!-- Tabs for User / Shop -->
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#userLogin" type="button">User Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopLogin" type="button">Shop Login</button>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      
      <!-- User Login -->
      <div class="tab-pane fade show active" id="userLogin">
        <form>
          <div class="mb-3 text-start">
            <label class="form-label">Login Name</label>
            <input type="text" class="form-control" placeholder="Enter Login Name" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Aadhaar No.</label>
            <input type="text" class="form-control" placeholder="Enter Aadhaar Number" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">OTP</label>
            <input type="text" class="form-control" placeholder="Enter OTP" required>
          </div>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-secondary">Resend OTP</button>
            <button type="submit" class="btn btn-primary">Next</button>
          </div>
        </form>
      </div>

      <!-- Shop Login -->
      <div class="tab-pane fade" id="shopLogin">
        <form>
          <div class="mb-3 text-start">
            <label class="form-label">Shop ID</label>
            <input type="text" class="form-control" placeholder="Enter Shop ID" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Phone No.</label>
            <input type="tel" class="form-control" placeholder="Enter Phone Number" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">OTP</label>
            <input type="text" class="form-control" placeholder="Enter OTP" required>
          </div>
          <button type="submit" class="btn btn-primary btn-custom">Next</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showLanguage() {
      document.getElementById("welcomePage").classList.add("hidden");
      document.getElementById("languagePage").classList.remove("hidden");
    }
    function showLogin() {
      document.getElementById("languagePage").classList.add("hidden");
      document.getElementById("loginPage").classList.remove("hidden");
    }
  </script>
</body>
</html>
